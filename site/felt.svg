<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360">
  <filter id="cloud" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" stitchTiles="stitch"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.60  0 0 0 0 0.52  0 0 0 0 0.42  0 0 0 0.12 0"/>
  </filter>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.95" numOctaves="1" seed="5" stitchTiles="stitch"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.52  0 0 0 0 0.45  0 0 0 0 0.38  0 0 0 0.09 0"/>
  </filter>
  <rect width="360" height="360" filter="url(#cloud)"/>
  <rect width="360" height="360" filter="url(#grain)"/>
</svg>
